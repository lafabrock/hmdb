plugins { id 'com.android.application' }

android {
    namespace 'fr.lafabrock.hmdbtv'
    compileSdk 34
    defaultConfig {
        applicationId 'fr.lafabrock.hmdbtv'
        minSdk 21
        targetSdk 34
        versionCode 6
        versionName '1.5'
    }
    signingConfigs {
        release {
            storeFile rootProject.file('hmdb.keystore')
            storePassword 'hmdbtv'
            keyAlias 'hmdb'
            keyPassword 'hmdbtv'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
