<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HMDB — les films de la maison</title>
<style>
:root{--bg:#f6f5f0;--card:#fff;--ink:#1d1d1b;--mute:#6b6a64;--line:#e4e2da;--acc:#9bbf1f;--accd:#5f7a0c;--vu:#2e7d32;--av:#1565c0;--non:#9e9e9e}
@media (prefers-color-scheme:dark){:root{--bg:#141412;--card:#1e1e1b;--ink:#eeede8;--mute:#a3a29b;--line:#33332e;--acc:#a6c93a;--accd:#c4e25a;--vu:#66bb6a;--av:#64b5f6;--non:#8a8a8a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 12px 8px}
h1{font-size:17px;margin:0 0 2px}
.sub{color:var(--mute);font-size:12px;margin-bottom:8px}
#q{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:7px 0 1px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#1d1d1b;font-weight:600}
.stats{font-size:12px;color:var(--mute);margin-top:6px;display:flex;justify-content:space-between;gap:8px}
#save{color:var(--accd)}
main{padding:10px 12px 40px;max-width:1200px;margin:0 auto}
.head{display:none}
.row{display:grid;grid-template-columns:58px 1fr;gap:4px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:9px}
.poster{grid-row:1;width:58px;height:84px;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:18px;color:#fff;text-decoration:none;text-shadow:0 1px 2px rgba(0,0,0,.35);position:relative}
.poster small{position:absolute;bottom:3px;left:0;right:0;font-size:9px;font-weight:500;opacity:.9}
.t .fr{font-weight:650;font-size:15.5px}
.t .or{font-style:italic;color:var(--mute);font-size:13px}
.meta{font-size:13px;color:var(--mute)}
.age{display:inline-block;background:var(--acc);color:#1d1d1b;border-radius:6px;font-size:11px;font-weight:700;padding:1px 6px;margin-right:6px}
.chk{color:#c77700;font-size:11px;margin-left:4px}
.acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.lnk{font-size:12.5px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--bg)}
.cp{cursor:pointer;font:inherit;font-size:12.5px}
.cp.ok{border-color:var(--vu);color:var(--vu)}
.st{display:flex;margin-left:auto;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.st button{border:0;background:var(--bg);color:var(--mute);font:inherit;font-size:12.5px;padding:6px 9px;cursor:pointer}
.st button+button{border-left:1px solid var(--line)}
.st button.on[data-s=vu]{background:var(--vu);color:#fff}
.st button.on[data-s=avoir]{background:var(--av);color:#fff}
.st button.on[data-s=non]{background:var(--non);color:#fff}
.row.s-non{opacity:.6}
.meta.y,.meta.d,.agec{display:none}
.rndb{border:0;background:var(--accd);color:var(--bg);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;margin-right:8px}
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.mod{background:var(--bg);border-radius:18px;padding:14px;width:100%;max-width:520px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.mod h2{font-size:15px;margin:0 0 10px;color:var(--mute);font-weight:600}
.mod .row{display:grid;grid-template-columns:58px 1fr;gap:4px 12px;margin:0}
.mod .row .poster{grid-row:1;width:58px;height:84px;font-size:18px}
.mod .meta.y,.mod .meta.d,.mod .agec{display:none}
.mod .t .metam{display:block}
.mod .acts{display:flex;grid-column:1/-1}
.mod .links{flex-wrap:wrap}
.mbtn{display:flex;gap:8px;margin-top:12px}
.mbtn button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px;font:inherit;font-weight:600;cursor:pointer}
.mbtn button.p{background:var(--acc);border-color:var(--acc);color:#1d1d1b}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:12px 10px;grid-auto-flow:row dense}
.tile{border:0;background:none;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit;min-width:0}
.tile .pz{aspect-ratio:2/3;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:26px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);position:relative}
.tile .tt{font-size:12.5px;font-weight:600;line-height:1.25;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .ty{font-size:11.5px;color:var(--mute)}
.tile.sel .pz{outline:3px solid var(--accd);outline-offset:2px}
.tile.s-non{opacity:.5}
.bdg{position:absolute;top:5px;right:5px;border-radius:6px;font-size:10.5px;font-weight:600;padding:1px 5px;color:#fff;text-shadow:none}
.bdg.vu{background:var(--vu)}.bdg.avoir{background:var(--av)}.bdg.non{background:var(--non)}
.gdet{grid-column:1/-1}
.gdet .row{display:grid;grid-template-columns:58px 1fr;gap:4px 12px;margin:0;border:2px solid var(--accd)}
.gdet .row .poster{grid-row:1;width:58px;height:84px;font-size:18px}
.gdet .meta.y,.gdet .meta.d,.gdet .agec{display:none}
.gdet .t .metam{display:block}
.gdet .acts{display:flex;grid-column:1/-1}
.gdet .links{flex-wrap:wrap}
main.g .head{display:none!important}
.has{background-size:cover!important;background-position:center!important;color:transparent!important;text-shadow:none!important}
.has small{display:none}
footer{max-width:1200px;margin:0 auto;padding:0 12px 30px;font-size:11.5px;color:var(--mute)}
footer a{color:inherit}
.nasb{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;color:var(--accd)}
.nasb.whale{color:#8a5a00}
.empty{text-align:center;color:var(--mute);padding:30px}
@media (max-width:420px){.st{margin-left:0;width:100%}.st button{flex:1}}
@media (min-width:980px){
 .head,.row{display:grid;grid-template-columns:50px 2fr 48px 1.3fr 52px 330px 240px;gap:0 12px;align-items:center}
 .head{font-size:12px;color:var(--mute);font-weight:600;padding:0 10px 6px;border-bottom:1px solid var(--line);margin-bottom:6px}
 .row{border-radius:10px;padding:7px 10px;margin-bottom:6px}
 .poster{grid-row:auto;width:42px;height:60px;font-size:14px}
 .poster small{display:none}
 .meta.y,.meta.d,.agec{display:block}
 .t .metam{display:none}
 .acts{display:contents}
 .links{display:flex;gap:5px}
 .st{margin-left:0;justify-self:start}
 .links{flex-wrap:nowrap}
}
.links{display:flex;gap:6px;flex-wrap:wrap}

.who{font-size:13px;margin:4px 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.login{display:flex;gap:6px;width:100%}
.login input,.sinput{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:16px;width:100%}
.sinput{margin-bottom:8px}
.hint{font-size:12px;color:var(--mute);padding:4px 0}
.linkb{border:0;background:none;color:var(--accd);font:inherit;text-decoration:underline;cursor:pointer;padding:0}
body.reqmode #ages,body.reqmode #sts,body.reqmode #q{display:none}
.reqtop{margin-bottom:10px}
.rndb.big{padding:9px 16px;font-size:14px}
.rndb[disabled]{opacity:.5}
.rbadge{display:inline-block;margin-top:5px;color:#fff;border-radius:6px;font-size:12px;font-weight:600;padding:2px 8px}
main.r .head{display:none!important}
@media (min-width:980px){main.r .row{display:grid;grid-template-columns:58px 1fr;gap:4px 12px}main.r .poster{grid-row:1;width:58px;height:84px}main.r .acts{display:flex;grid-column:1/-1}main.r .links{flex-wrap:wrap}}
.sres{max-height:52vh;overflow:auto}
.sitem{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.sitem .sp{width:44px;height:64px;border-radius:6px;background:var(--line);flex:none;background-size:cover;background-position:center}
.sitem .si{flex:1;font-size:13.5px;line-height:1.3}

.tabs{display:flex;gap:6px;margin:6px 0 8px;overflow-x:auto;scrollbar-width:none}
.tab{flex:none;border:0;border-bottom:3px solid transparent;background:none;color:var(--mute);font:inherit;font-weight:650;font-size:14.5px;padding:6px 8px;cursor:pointer}
.tab span{font-size:11.5px;background:var(--line);color:var(--ink);border-radius:999px;padding:1px 6px;margin-left:2px}
.tab.on{color:var(--ink);border-bottom-color:var(--acc)}
#sagas:empty,#ages:empty,#cats:empty,#sorts:empty{display:none}
#sagas .chip{font-size:12px;padding:4px 9px}
#sorts{font-size:13px;color:var(--mute);margin-top:6px}
#sorts select{font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:3px 6px}
body.reqmode #sorts{display:none}
@media (max-width:700px){header{position:static}}
</style>
</head>

<header>

 if(f.cat==='Séries'){var q=f.fr.replace(/\s*\(.*\)\s*$/,'');var tt=[[q,f.y],[q,0]];var nx=function(i){if(i>=tt.length)return Promise.resolve('');return tmdbTv(tt[i][0],tt[i][1]).then(function(r){r=r.filter(function(x){return x.poster_path});return r.length?{p:r[0].poster_path,t:r[0].title,id:r[0].id,tv:1,y:+(r[0].release_date||'').slice(0,4)||0}:nx(i+1)})};return nx(0)}

 var extra=(f.loc==='W'?'<span class="nasb whale">💾 Sur Whale</span>':(f.nas&&f.livre?'<span class="nasb">📀 À la maison</span>':''))+(f.livre&&ui.tab!=='livre'?'<span class="nasb">📚 Liste '+f.age+' ans</span>':'')+(r?'<span class="nasb" style="color:'+RST[r.statut][1]+'">'+RST[r.statut][0]+'</span>':'');
 var what=f.d||[f.cat,f.saga].filter(Boolean).join(' · ');
 var q=f.livre?f.or:T,id=info(f)&&info(f).id;
 var imdb='https://www.imdb.com/find/?s=tt&q='+enc(q+(Y?' '+Y:'')),sc='https://www.senscritique.com/search?query='+enc(T),rt='https://www.rottentomatoes.com/search?search='+enc(q),aff=id?'https://www.themoviedb.org/'+(info(f).tv?'tv/':'movie/')+id:'https://www.google.com/search?tbm=isch&q='+enc('affiche film '+T+' '+Y);
 var ask=(API&&!f.nas&&!r)?'<button class="lnk" data-ask="'+f.id+'">🙋 Demander</button>':'';
 var age=f.age?'<span class="age">'+f.age+' ans</span>':'';
 return '<div class="row'+(s?' s-'+s:'')+'">'+
  '<a class="poster" data-pk="'+f.id+'" href="'+aff+'" target="_blank" rel="noopener" style="background:linear-gradient(150deg,'+c+','+c+'99)">'+esc(initials(T))+'<small>affiche ↗</small></a>'+
  '<div class="t"><div class="fr" data-tt="'+f.id+'">'+esc(T)+'</div>'+orig+'<div class="meta metam">'+age+(Y||'')+(what?' · '+esc(what):'')+extra+'</div></div>'+
  '<div class="meta y">'+(Y||'')+'</div><div class="meta d">'+esc(what)+extra+'</div><div class="agec">'+age+'</div>'+
  '<div class="acts"><div class="links"><a class="lnk" href="'+imdb+'" target="_blank" rel="noopener">IMDb</a><a class="lnk" href="'+sc+'" target="_blank" rel="noopener">SensCritique</a><a class="lnk" href="'+rt+'" target="_blank" rel="noopener">Rotten 🍅</a><button class="lnk cp" data-copy="'+f.id+'">📋 Copier</button>'+ask+'</div>'+
  '<div class="st">'+STS.map(function(x){return'<button data-id="'+f.id+'" data-s="'+x[0]+'" class="'+(s===x[0]?'on':'')+'">'+x[1]+'</button>'}).join('')+'</div></div></div>';
}
function tile(f){
 var s=st(f),c=color(f),T=title(f),Y=year(f);
 var bd=s?'<span class="bdg '+s+'">'+({vu:'✓ Vu',avoir:'À voir',non:'✗'})[s]+'</span>':'';
 var sub=[Y,f.age?f.age+' ans':'',ui.tab==='livre'&&f.nas?(f.loc==='W'?'💾':'📀'):'',ui.tab==='lib'&&f.loc==='W'?'💾':'',ui.tab==='lib'&&f.livre?'📚':''].filter(Boolean).join(' · ');
 return '<button class="tile'+(SEL===f.id?' sel':'')+(s?' s-'+s:'')+'" data-tile="'+f.id+'"><div class="pz" data-pk="'+f.id+'" style="background:linear-gradient(150deg,'+c+','+c+'99)">'+esc(initials(T))+bd+'</div><div class="tt" data-tt="'+f.id+'">'+esc(T)+'</div><div class="ty">'+sub+'</div></button>';
}
function reqView(){
 var H='<div class="reqtop"><button class="rndb big" data-newreq="1">+ Demander un film</button></div>';
 if(!API)return '<div class="empty">La synchro n\'est pas branchée.</div>';
 if(!ME)return '<div class="empty">Entre ton code famille en haut de la page pour voir et faire des demandes.</div>';
 if(!REQ.length)return H+'<div class="empty">Aucune demande pour l\'instant.</div>';
 var order={demande:0,encours:1,dispo:2,refuse:3};
 var list=REQ.slice().sort(function(a,b){return(order[a.statut]-order[b.statut])||(b.date>a.date?1:-1)});
 var admin=ME.role==='admin';
 return H+list.map(function(r){
  var rs=RST[r.statut]||RST.demande,mine=r.par===ME.nom;
  var adm=admin?'<div class="st">'+Object.keys(RST).map(function(k){return'<button data-rq="'+esc(r.id)+'" data-rs="'+k+'" class="'+(r.statut===k?'on':'')+'" style="'+(r.statut===k?'background:'+RST[k][1]+';color:#fff':'')+'">'+RST[k][0]+'</button>'}).join('')+'</div>':'';
  var del=(admin||(mine&&r.statut==='demande'))?'<button class="lnk" data-rdel="'+esc(r.id)+'">🗑 Retirer</button>':'';
  var tm=r.tmdb?'<a class="lnk" href="https://www.themoviedb.org/movie/'+enc(r.tmdb)+'" target="_blank" rel="noopener">Fiche TMDB</a>':'';
  return '<div class="row req"><div class="poster"'+(r.affiche?' data-img="'+esc(r.affiche)+'"':'')+' style="background:linear-gradient(150deg,#37474f,#37474f99)">'+esc(initials(r.titre))+'</div>'+
   '<div class="t"><div class="fr">'+esc(r.titre)+'</div>'+(r.orig&&r.orig!==r.titre?'<div class="or">'+esc(r.orig)+'</div>':'')+
   '<div class="meta">'+esc(r.annee)+' · demandé par '+esc(r.par)+' le '+esc(String(r.date).slice(0,10))+'</div>'+(r.note?'<div class="meta">« '+esc(r.note)+' »</div>':'')+
   '<div><span class="rbadge" style="background:'+rs[1]+'">'+rs[0]+'</span></div></div>'+
   '<div class="acts"><div class="links">'+tm+del+'</div>'+adm+'</div></div>';
 }).join('');
}
function render(){
 who();chips();
 var R=ui.tab==='req';
 document.body.classList.toggle('reqmode',R);
 var main=document.querySelector('main');main.classList.toggle('g',!R&&ui.view==='gal');main.classList.toggle('r',R);
 if(R){$('count').textContent=REQ.length+' demande'+(REQ.length>1?'s':'');$('list').innerHTML=reqView();hydrate();return}
 var q=norm(ui.q||'');
 var rows=scope().filter(function(f){
  if(ui.tab==='livre'&&ui.age&&f.age!==ui.age)return false;
  if(ui.tab==='lib'&&ui.cat){if(ui.cat==='saga:'){if(!f.saga)return false}else if(ui.cat.indexOf('saga:')===0){if(f.saga!==ui.cat.slice(5))return false}else if(f.cat!==ui.cat)return false}
  var s=st(f)||'none';if(ui.st==='nas'){if(!f.nas)return false}else if(ui.st!=='all'&&s!==ui.st)return false;
  if(q&&norm(title(f)+' '+f.fr+' '+f.or+' '+f.d+' '+year(f)+' '+f.saga).indexOf(q)<0)return false;return true});
 if(ui.tab==='lib'){
  if(ui.sort==='az')rows.sort(function(a,b){return norm(title(a)).localeCompare(norm(title(b)),'fr')});
  else if(ui.sort==='year')rows.sort(function(a,b){return(year(b)||0)-(year(a)||0)});
  else rows.sort(function(a,b){return b.add-a.add});
 }
 VIS=rows;
 $('count').textContent=rows.length+' titre'+(rows.length>1?'s':'');
 var H;
 if(!rows.length)H='<div class="empty">Aucun film ne correspond.</div>';
 else if(ui.view==='gal')H='<div class="gal">'+rows.map(function(f){return SEL===f.id?tile(f)+'<div class="gdet">'+card(f)+'</div>':tile(f)}).join('')+'</div>';
 else H=rows.map(card).join('');
 $('list').innerHTML=H;hydrate();
 if(OPEN){OPEN=false;var gd=document.querySelector('.gdet');if(gd)try{gd.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){}}
}

/* ---------- Fenêtres ---------- */
function overlay(html){
 if(!OV){OV=document.createElement('div');OV.className='ov';OV.addEventListener('click',function(e){if(e.target===OV)closeOV()});document.body.appendChild(OV)}
 OV.innerHTML='<div class="mod">'+html+'</div>';hydrate();
}
function closeOV(){if(OV){OV.remove();OV=null}curId=null}
function showCard(id){curId=id;overlay('<h2>🎲 Et si on regardait…</h2>'+card(FILMS[id])+'<div class="mbtn"><button data-rnd="1" class="p">🎲 Un autre</button><button data-close="1">Fermer</button></div>')}
function pick(){
 var pool=VIS.filter(function(f){var s=st(f);return ui.st!=='all'?true:(s!=='vu'&&s!=='non')});
 if(!pool.length)pool=VIS.filter(function(f){return st(f)!=='non'});
 if(!pool.length)pool=VIS;if(!pool.length)return;
 if(pool.length>1&&curId!=null)pool=pool.filter(function(f){return f.id!==curId});
 showCard(pool[Math.floor(Math.random()*pool.length)].id);
}
var SR=[],srT=null;
function newReq(){
 curId=null;
 overlay('<h2>🙋 Demander un film</h2><input id="tsearch" class="sinput" type="search" placeholder="Titre du film…" autocomplete="off"><input id="tnote" class="sinput" placeholder="Un petit mot ? (facultatif)" maxlength="300"><div id="sres" class="sres"><div class="hint">Tape au moins 2 lettres.</div></div><div class="mbtn"><button data-close="1">Fermer</button></div>');
 setTimeout(function(){var i=$('tsearch');if(i)i.focus()},50);
}
function owned(m){var y=(m.release_date||'').slice(0,4);return FILMS.filter(function(f){if(!f.nas)return false;var i=info(f);return(i&&i.id===m.id)||(norm(title(f))===norm(m.title)&&(!f.y||!y||String(f.y)===y))})[0]}
function searchReq(q){
 var box=$('sres');if(!box)return;
 if(q.length<2){box.innerHTML='<div class="hint">Tape au moins 2 lettres.</div>';return}
 box.innerHTML='<div class="hint">Recherche…</div>';
 tmdb(q,0).then(function(res){
  SR=res.slice(0,10);if(!$('sres'))return;
  $('sres').innerHTML=SR.length?SR.map(function(m,i){var y=(m.release_date||'').slice(0,4),o=owned(m);
   return '<div class="sitem"><div class="sp"'+(m.poster_path?' data-img="'+esc(m.poster_path)+'"':'')+'></div><div class="si"><b>'+esc(m.title)+'</b>'+(m.original_title&&m.original_title!==m.title?'<br><i>'+esc(m.original_title)+'</i>':'')+'<br><span class="meta">'+esc(y||'année ?')+'</span></div>'+(o?'<span class="nasb">📀 Déjà à la maison</span>':'<button class="rndb" data-pick="'+i+'">Demander</button>')+'</div>'}).join(''):'<div class="hint">Aucun résultat.</div>';
  hydrate();
 },function(){if($('sres'))$('sres').innerHTML='<div class="hint">Recherche impossible pour le moment.</div>'});
}
function addReq(d){
 var dup=REQ.filter(function(r){return r.statut!=='refuse'&&(d.tmdb&&String(r.tmdb)===String(d.tmdb)||(r.titre===d.titre&&String(r.annee)===String(d.annee)))})[0];
 if(dup){flash('Déjà demandé par '+dup.par);return}
 send('addRequest',d).then(function(j){if(j.ok){flash('Demande envoyée ✓');closeOV();sync()}});
}
function copyText(t,btn){
 function ok(){btn.classList.add('ok');btn.textContent='✓ Copié';setTimeout(function(){btn.classList.remove('ok');btn.textContent='📋 Copier'},1400)}
 function fb(){try{var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);ok()}catch(e){btn.textContent=t}}
 try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}
}
function saveUi(){lsSet('ui2',ui)}

/* ---------- Événements ---------- */
document.addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b||(b.form&&b.type==='submit'))return;
 var d=b.dataset;
 if(d.tab){ui.tab=d.tab;ui.st='all';SEL=null;saveUi();render();window.scrollTo(0,0);if(d.tab==='req')sync();return}
 if(b.id==='rnd'||d.rnd){if(ui.tab==='req'){ui.tab='lib';render()}pick();return}
 if(d.close){closeOV();return}
 if(b.id==='vw'){ui.view=ui.view==='gal'?'list':'gal';saveUi();render();return}
 if(d.logout){CODE='';ME=null;lsSet('code','');lsSet('me',null);render();return}
 if(d.tile!=null){var t=+d.tile;SEL=SEL===t?null:t;OPEN=SEL!=null;render();return}
 if(d.age!=null){ui.age=+d.age;saveUi();render();return}
 if(d.cat!=null){ui.cat=d.cat;saveUi();render();return}
 if(d.st){ui.st=d.st;saveUi();render();return}
 if(d.copy!=null){copyText(title(FILMS[+d.copy]),b);return}
 if(d.newreq){if(!ME){flash('Entre d\'abord ton code famille');return}newReq();return}
 if(d.pick!=null){var m=SR[+d.pick];if(!m)return;addReq({titre:m.title,orig:m.original_title||'',annee:(m.release_date||'').slice(0,4),tmdb:m.id,affiche:m.poster_path||'',note:($('tnote')||{}).value||''});return}
 if(d.ask!=null){if(!ME){flash('Entre d\'abord ton code famille');return}var f=FILMS[+d.ask],i=info(f);addReq({titre:f.fr,orig:f.or,annee:f.y,tmdb:i?i.id:'',affiche:i?i.p:'',note:'Liste du livre ('+f.age+' ans)'});return}
 if(d.rq){var r0=REQ.filter(function(x){return x.id===d.rq})[0];if(r0)r0.statut=d.rs;render();send('updateRequest',{id:d.rq,statut:d.rs}).then(sync);return}
 if(d.rdel){REQ=REQ.filter(function(x){return x.id!==d.rdel});render();send('deleteRequest',{id:d.rdel}).then(sync);return}
 if(d.s){var f2=FILMS[+d.id],k=pkey(f2),v=STATE[k]===d.s?'':d.s;if(v)STATE[k]=v;else delete STATE[k];lsSet('state2',STATE);render();if(OV&&curId!=null)showCard(curId);send('setStatus',{key:k,titre:title(f2),statut:v});return}
});
document.addEventListener('change',function(e){if(e.target.id==='sortsel'){ui.sort=e.target.value;saveUi();render()}});
document.addEventListener('submit',function(e){
 if(e.target.id!=='login')return;e.preventDefault();
 var v=($('codein').value||'').trim();if(!v)return;CODE=v;lsSet('code',CODE);setSave('Connexion…');sync();
});
document.addEventListener('input',function(e){
 if(e.target.id==='q'){ui.q=e.target.value;saveUi();render()}
 if(e.target.id==='tsearch'){clearTimeout(srT);var v=e.target.value.trim();srT=setTimeout(function(){searchReq(v)},400)}
});
document.addEventListener('visibilitychange',function(){if(!document.hidden)sync()});
setInterval(function(){if(!document.hidden)sync()},60000);

$('q').value=ui.q||'';
function libDate(d){var el=$('libdate');if(el)el.textContent=d?' Vidéothèque mise à jour le '+d.split(' ')[0].split('-').reverse().join('/')+'.':''}
libDate(LIBC&&LIBC.updated);
render();
sync();
if(API)fetch(API+'?action=library').then(function(r){return r.json()}).then(function(j){
 if(!j.ok||!j.library||!j.library.length)return;
 var prev=LIBC&&JSON.stringify(LIBC.rows);LIBC={rows:j.library,updated:j.updated};lsSet('lib2',LIBC);libDate(j.updated);
 if(prev===JSON.stringify(j.library))return;
 var keep=SEL!=null&&FILMS[SEL]?pkey(FILMS[SEL]):null;buildFilms(j.library);SEL=null;
 if(keep)FILMS.forEach(function(f){if(pkey(f)===keep)SEL=f.id});
 if(OV)closeOV();render();
}).catch(function(){});
})();

</script>
</body>
