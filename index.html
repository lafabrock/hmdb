<title>Films à voir de 9 à 12 ans</title>
<style id="css">
:root{--bg:#f6f5f0;--card:#fff;--ink:#1d1d1b;--mute:#6b6a64;--line:#e4e2da;--acc:#9bbf1f;--accd:#5f7a0c;--vu:#2e7d32;--av:#1565c0;--non:#9e9e9e}
@media (prefers-color-scheme:dark){:root{--bg:#141412;--card:#1e1e1b;--ink:#eeede8;--mute:#a3a29b;--line:#33332e;--acc:#a6c93a;--accd:#c4e25a;--vu:#66bb6a;--av:#64b5f6;--non:#8a8a8a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 12px 8px}
h1{font-size:17px;margin:0 0 2px}
.sub{color:var(--mute);font-size:12px;margin-bottom:8px}
#q{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:7px 0 1px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#1d1d1b;font-weight:600}
.stats{font-size:12px;color:var(--mute);margin-top:6px;display:flex;justify-content:space-between;gap:8px}
#save{color:var(--accd)}
main{padding:10px 12px 40px;max-width:1200px;margin:0 auto}
.head{display:none}
.row{display:grid;grid-template-columns:58px 1fr;gap:4px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:9px}
.poster{grid-row:1;width:58px;height:84px;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:18px;color:#fff;text-decoration:none;text-shadow:0 1px 2px rgba(0,0,0,.35);position:relative}
.poster small{position:absolute;bottom:3px;left:0;right:0;font-size:9px;font-weight:500;opacity:.9}
.t .fr{font-weight:650;font-size:15.5px}
.t .or{font-style:italic;color:var(--mute);font-size:13px}
.meta{font-size:13px;color:var(--mute)}
.age{display:inline-block;background:var(--acc);color:#1d1d1b;border-radius:6px;font-size:11px;font-weight:700;padding:1px 6px;margin-right:6px}
.chk{color:#c77700;font-size:11px;margin-left:4px}
.acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.lnk{font-size:12.5px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--bg)}
.cp{cursor:pointer;font:inherit;font-size:12.5px}
.cp.ok{border-color:var(--vu);color:var(--vu)}
.st{display:flex;margin-left:auto;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.st button{border:0;background:var(--bg);color:var(--mute);font:inherit;font-size:12.5px;padding:6px 9px;cursor:pointer}
.st button+button{border-left:1px solid var(--line)}
.st button.on[data-s=vu]{background:var(--vu);color:#fff}
.st button.on[data-s=avoir]{background:var(--av);color:#fff}
.st button.on[data-s=non]{background:var(--non);color:#fff}
.row.s-non{opacity:.6}
.meta.y,.meta.d,.agec{display:none}
.rndb{border:0;background:var(--accd);color:var(--bg);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;margin-right:8px}
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.mod{background:var(--bg);border-radius:18px;padding:14px;width:100%;max-width:520px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.mod h2{font-size:15px;margin:0 0 10px;color:var(--mute);font-weight:600}
.mod .row{display:grid;grid-template-columns:58px 1fr;gap:4px 12px;margin:0}
.mod .row .poster{grid-row:1;width:58px;height:84px;font-size:18px}
.mod .meta.y,.mod .meta.d,.mod .agec{display:none}
.mod .t .metam{display:block}
.mod .acts{display:flex;grid-column:1/-1}
.mod .links{flex-wrap:wrap}
.mbtn{display:flex;gap:8px;margin-top:12px}
.mbtn button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px;font:inherit;font-weight:600;cursor:pointer}
.mbtn button.p{background:var(--acc);border-color:var(--acc);color:#1d1d1b}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:12px 10px;grid-auto-flow:row dense}
.tile{border:0;background:none;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit;min-width:0}
.tile .pz{aspect-ratio:2/3;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:26px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);position:relative}
.tile .tt{font-size:12.5px;font-weight:600;line-height:1.25;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .ty{font-size:11.5px;color:var(--mute)}
.tile.sel .pz{outline:3px solid var(--accd);outline-offset:2px}
.tile.s-non{opacity:.5}
.bdg{position:absolute;top:5px;right:5px;border-radius:6px;font-size:10.5px;font-weight:600;padding:1px 5px;color:#fff;text-shadow:none}
.bdg.vu{background:var(--vu)}.bdg.avoir{background:var(--av)}.bdg.non{background:var(--non)}
.gdet{grid-column:1/-1}
.gdet .row{display:grid;grid-template-columns:58px 1fr;gap:4px 12px;margin:0;border:2px solid var(--accd)}
.gdet .row .poster{grid-row:1;width:58px;height:84px;font-size:18px}
.gdet .meta.y,.gdet .meta.d,.gdet .agec{display:none}
.gdet .t .metam{display:block}
.gdet .acts{display:flex;grid-column:1/-1}
.gdet .links{flex-wrap:wrap}
main.g .head{display:none!important}
.has{background-size:cover!important;background-position:center!important;color:transparent!important;text-shadow:none!important}
.has small{display:none}
footer{max-width:1200px;margin:0 auto;padding:0 12px 30px;font-size:11.5px;color:var(--mute)}
footer a{color:inherit}
.nasb{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;color:var(--accd)}
.empty{text-align:center;color:var(--mute);padding:30px}
@media (max-width:420px){.st{margin-left:0;width:100%}.st button{flex:1}}
@media (min-width:980px){
 .head,.row{display:grid;grid-template-columns:50px 2fr 48px 1.3fr 52px 330px 240px;gap:0 12px;align-items:center}
 .head{font-size:12px;color:var(--mute);font-weight:600;padding:0 10px 6px;border-bottom:1px solid var(--line);margin-bottom:6px}
 .row{border-radius:10px;padding:7px 10px;margin-bottom:6px}
 .poster{grid-row:auto;width:42px;height:60px;font-size:14px}
 .poster small{display:none}
 .meta.y,.meta.d,.agec{display:block}
 .t .metam{display:none}
 .acts{display:contents}
 .links{display:flex;gap:5px}
 .st{margin-left:0;justify-self:start}
 .links{flex-wrap:nowrap}
}
.links{display:flex;gap:6px;flex-wrap:wrap}
</style>

<script id="app">
(function(){
var NAS=["Harry Potter à l'école des sorciers", "Mon oncle", "Un jour sans fin", "Butch Cassidy et le Kid", "Goldfinger", "Jeux dangereux", "Sister Act", "Ant-Man", "Batman", "La Mort aux trousses", "Le Seigneur des anneaux : La Communauté de l'anneau", "Spider-Man 2", "Danse avec les loups", "Le Magnifique", "Men in Black", "Pirates des Caraïbes : La Malédiction du Black Pearl", "West Side Story", "Les Aventures du baron de Münchausen", "Les Aventuriers de l'Arche perdue", "Monty Python : Sacré Graal !"];
var FILMS=JSON.parse(document.getElementById('films').textContent).map(function(f,i){return{id:i,age:f[0],fr:f[1],or:f[2]||f[1],y:f[3],d:f[4],chk:!!f[5],nas:NAS.indexOf(f[1])>=0}});
var STATE={};try{STATE=JSON.parse(document.getElementById('state').textContent)||{}}catch(e){}
var LS='films912-';
function lsGet(k,d){try{var v=localStorage.getItem(LS+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(LS+k,JSON.stringify(v))}catch(e){}}
var shared=false,art=null,pending=null,timer=null,card=null,VIS=[],curId=null,OV=null,SEL=lsGet('sel',null),OPEN=false;
var local=lsGet('state',null);if(local&&!Object.keys(STATE).length)STATE=local;
var ui=lsGet('ui',{age:0,st:'all',q:''});
var STS=[['vu','✓ Vu'],['avoir','À voir'],['non','Pas intéressé']];
var COLORS=['#5f7a0c','#1565c0','#6a1b9a','#c62828','#ef6c00','#00838f','#4e342e','#37474f','#ad1457','#2e7d32'];
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function enc(s){return encodeURIComponent(s)}
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
function initials(t){var w=t.replace(/^(Le|La|Les|L'|The|Un|Une)\s*/i,'').split(/[\s,:'-]+/).filter(function(x){return x&&!/^(et|de|du|des|la|le|les|l|d|a|à|of|the|and)$/i.test(x)});return (w[0]||'?')[0].toUpperCase()+((w[1]||'')[0]||'').toUpperCase()}
function chips(){
 var a=document.getElementById('ages');a.innerHTML=[0,9,10,11,12].map(function(x){return'<button class="chip'+(ui.age===x?' on':'')+'" data-age="'+x+'">'+(x?x+' ans':'Tous âges')+'</button>'}).join('');
 var counts={all:FILMS.length,vu:0,avoir:0,non:0,none:0,nas:0};FILMS.forEach(function(f){counts[STATE[f.id]||'none']++;if(f.nas)counts.nas++});
 var s=document.getElementById('sts');s.innerHTML=[['all','Tous'],['nas','📀 À la maison'],['avoir','À voir'],['vu','Vus'],['none','Sans statut'],['non','Pas intéressé']].map(function(x){return'<button class="chip'+(ui.st===x[0]?' on':'')+'" data-st="'+x[0]+'">'+x[1]+' ('+counts[x[0]]+')</button>'}).join('');
}
function render(){
 chips();
 var q=norm(ui.q||'');
 var rows=FILMS.filter(function(f){
  if(ui.age&&f.age!==ui.age)return false;
  var s=STATE[f.id]||'none';if(ui.st==='nas'){if(!f.nas)return false}else if(ui.st!=='all'&&s!==ui.st)return false;
  if(q&&norm(f.fr+' '+f.or+' '+f.d+' '+f.y).indexOf(q)<0)return false;return true});
 document.getElementById('count').textContent=rows.length+' film'+(rows.length>1?'s':'')+' affiché'+(rows.length>1?'s':'');
 VIS=rows;var LH=rows.length?rows.map(card=function(f){
  var s=STATE[f.id]||'';var c=COLORS[(f.y+f.fr.length)%COLORS.length];
  var orig=f.or!==f.fr?'<div class="or">'+esc(f.or)+'</div>':'';
  var chk=f.chk?'<span class="chk" title="Plusieurs versions existent : vérifier laquelle le livre recommande">⚠ version à vérifier</span>':'';if(f.nas)chk+='<span class="nasb">📀 À la maison</span>';
  var imdb='https://www.imdb.com/find/?s=tt&q='+enc(f.or+' '+f.y);
  var sc='https://www.senscritique.com/search?query='+enc(f.fr);
  var rt='https://www.rottentomatoes.com/search?search='+enc(f.or);
  var aff='https://www.google.com/search?tbm=isch&q='+enc('affiche film '+f.fr+' '+f.y);
  return '<div class="row'+(s?' s-'+s:'')+'">'+
   '<a class="poster" data-pk="'+f.id+'" href="'+aff+'" target="_blank" rel="noopener" style="background:linear-gradient(150deg,'+c+','+c+'99)" title="Voir l\'affiche">'+esc(initials(f.fr))+'<small>affiche ↗</small></a>'+
   '<div class="t"><div class="fr">'+esc(f.fr)+'</div>'+orig+'<div class="meta metam"><span class="age">'+f.age+' ans</span>'+f.y+' · '+esc(f.d)+chk+'</div></div>'+
   '<div class="meta y">'+f.y+'</div><div class="meta d">'+esc(f.d)+chk+'</div><div class="agec"><span class="age">'+f.age+' ans</span></div>'+
   '<div class="acts"><div class="links"><a class="lnk" href="'+imdb+'" target="_blank" rel="noopener">IMDb</a><a class="lnk" href="'+sc+'" target="_blank" rel="noopener">SensCritique</a><a class="lnk" href="'+rt+'" target="_blank" rel="noopener">Rotten 🍅</a><button class="lnk cp" data-copy="'+f.id+'">📋 Copier</button></div>'+
   '<div class="st">'+STS.map(function(x){return'<button data-id="'+f.id+'" data-s="'+x[0]+'" class="'+(s===x[0]?'on':'')+'">'+x[1]+'</button>'}).join('')+'</div></div></div>';
 }).join(''):'<div class="empty">Aucun film ne correspond.</div>';
 var G=ui.view==='gal';
 if(G&&rows.length)LH='<div class="gal">'+rows.map(function(f){
  var s=STATE[f.id]||'';var c=COLORS[(f.y+f.fr.length)%COLORS.length];
  var bd=s?'<span class="bdg '+s+'">'+({vu:'✓ Vu',avoir:'À voir',non:'✗'})[s]+'</span>':'';
  var t='<button class="tile'+(SEL===f.id?' sel':'')+(s?' s-'+s:'')+'" data-tile="'+f.id+'"><div class="pz" data-pk="'+f.id+'" style="background:linear-gradient(150deg,'+c+','+c+'99)">'+esc(initials(f.fr))+bd+'</div><div class="tt">'+esc(f.fr)+'</div><div class="ty">'+f.y+' · '+f.age+' ans'+(f.nas?' · 📀':'')+'</div></button>';
  return SEL===f.id?t+'<div class="gdet">'+card(f)+'</div>':t;
 }).join('')+'</div>';
 document.getElementById('list').innerHTML=LH;
 document.querySelector('main').classList.toggle('g',G);
 document.getElementById('vw').textContent=G?'☰ Liste':'▦ Galerie';
 hydrate();
 if(OPEN){OPEN=false;var gd=document.querySelector('.gdet');if(gd)try{gd.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){}}
}
function showCard(id){
 curId=id;lsSet('rnd',id);var f=FILMS[id];
 if(!OV){OV=document.createElement('div');OV.className='ov';OV.addEventListener('click',function(e){if(e.target===OV)closeCard()});document.body.appendChild(OV)}
 OV.innerHTML='<div class="mod"><h2>🎲 Et si on regardait…</h2>'+card(f)+'<div class="mbtn"><button data-rnd="1" class="p">🎲 Un autre</button><button data-close="1">Fermer</button></div></div>';
 hydrate();
}
function closeCard(){if(OV){OV.remove();OV=null}curId=null;lsSet('rnd',null)}
function pick(){
 var pool=VIS.filter(function(f){var s=STATE[f.id]||'';return ui.st!=='all'?true:(s!=='vu'&&s!=='non')});
 if(!pool.length)pool=VIS.filter(function(f){return STATE[f.id]!=='non'});
 if(!pool.length)pool=VIS;if(!pool.length)return;
 if(pool.length>1&&curId!=null)pool=pool.filter(function(f){return f.id!==curId});
 showCard(pool[Math.floor(Math.random()*pool.length)].id);
}
var TMDB_KEY='76560d111980999307aa916fc86a4935',IMG='https://image.tmdb.org/t/p/w342';
var PC=lsGet('posters',{}),pcT=null,Q=[],RUN=0,IO=null;
function pkey(f){return f.fr+'|'+f.y}
function savePC(){clearTimeout(pcT);pcT=setTimeout(function(){lsSet('posters',PC)},800)}
function apply(el,p){if(p){el.style.backgroundImage='url('+IMG+p+')';el.classList.add('has')}}
function search(q,y){var u='https://api.themoviedb.org/3/search/movie?api_key='+TMDB_KEY+'&include_adult=false&language=fr-FR&query='+enc(q)+(y?'&year='+y:'');
 return fetch(u).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(j){var r=(j.results||[]).filter(function(x){return x.poster_path});return r.length?r[0].poster_path:null})}
function findPoster(f){
 var tries=[[f.or,f.y],[f.fr,f.y],[f.or,f.y-1],[f.or,f.y+1],[f.or,0]];
 function next(i){if(i>=tries.length)return Promise.resolve('');var t=tries[i];return search(t[0],t[1]).then(function(p){return p||next(i+1)})}
 return next(0);
}
function pump(){
 while(RUN<4&&Q.length){var f=Q.shift();var k=pkey(f);if(k in PC){paint(f);continue}RUN++;
  (function(f,k){findPoster(f).then(function(p){PC[k]=p;savePC();paint(f)},function(){}).then(function(){RUN--;pump()})})(f,k)}
}
function paint(f){var p=PC[pkey(f)];if(!p)return;document.querySelectorAll('[data-pk="'+f.id+'"]').forEach(function(el){apply(el,p)})}
function want(id){var f=FILMS[id];if(!f)return;if(pkey(f) in PC){paint(f);return}if(Q.indexOf(f)<0){Q.push(f);pump()}}
function hydrate(){
 if(!IO&&'IntersectionObserver' in window)IO=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){IO.unobserve(e.target);want(+e.target.dataset.pk)}})},{rootMargin:'600px'});
 document.querySelectorAll('[data-pk]:not([data-hy])').forEach(function(el){el.setAttribute('data-hy','1');var f=FILMS[+el.dataset.pk];var k=pkey(f);if(PC[k])apply(el,PC[k]);else if(!(k in PC)){if(IO)IO.observe(el);else want(f.id)}});
}
function copyText(t,btn){
 function ok(){btn.classList.add('ok');btn.textContent='✓ Copié';setTimeout(function(){btn.classList.remove('ok');btn.textContent='📋 Copier'},1400)}
 function fb(){try{var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);ok()}catch(e){btn.textContent=t}}
 try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}
}
function buildDoc(){
 var j=function(id){return document.getElementById(id).textContent};
 var safe=function(s){return s.replace(/<\/script/gi,'<\\/script')};
 return '<!DOCTYPE html>\n<html lang="fr">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>'+esc(document.title)+'</title>\n<style id="css">'+j('css')+'</style>\n</head>\n<body>\n'+BODY+'\n<script id="films" type="application/json">'+safe(j('films'))+'<\/script>\n<script id="state" type="application/json">'+safe(JSON.stringify(STATE))+'<\/script>\n<script id="app">'+safe(j('app'))+'<\/script>\n</body>\n</html>';
}
var BODY=document.querySelector('header').outerHTML.replace(/<div class="chips" id="ages">[\s\S]*?<\/div>/,'<div class="chips" id="ages"></div>').replace(/<div class="chips" id="sts">[\s\S]*?<\/div>/,'<div class="chips" id="sts"></div>').replace(/<span id="count">[^<]*<\/span>/,'<span id="count"></span>').replace(/<span id="save">[^<]*<\/span>/,'<span id="save"></span>')+'\n<main>\n <div class="head"><span>Affiche</span><span>Titre (FR / original)</span><span>Année</span><span>Réalisateur</span><span>Âge</span><span>Liens</span><span>Statut</span></div>\n <div id="list"></div>\n</main>';
function setSave(t){document.getElementById('save').textContent=t}
function persist(){
 lsSet('state',STATE);
 if(!shared||!art)return;
 setSave('Enregistrement…');clearTimeout(timer);
 timer=setTimeout(function(){
  lsSet('ui',ui);try{lsSet('scroll',window.scrollY)}catch(e){}
  art.publish(buildDoc()).then(function(){setSave('✓ Enregistré')},function(e){
   var c=e&&(e.code||e.message||'');
   if(/not_granted|not_writer/.test(c)){shared=false;setSave('Statuts gardés sur cet appareil')}else setSave('');
  });
 },1800);
}
document.addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;
 if(b.id==='rnd'||b.dataset.rnd){pick();return}
 if(b.dataset.close){closeCard();return}
 if(b.id==='vw'){ui.view=ui.view==='gal'?'list':'gal';lsSet('ui',ui);render();return}
 if(b.dataset.tile!=null){var tid=+b.dataset.tile;SEL=SEL===tid?null:tid;OPEN=SEL!=null;lsSet('sel',SEL);render();return}
 if(b.dataset.age!=null){ui.age=+b.dataset.age;lsSet('ui',ui);render();return}
 if(b.dataset.st){ui.st=b.dataset.st;lsSet('ui',ui);render();return}
 if(b.dataset.copy!=null){copyText(FILMS[+b.dataset.copy].fr,b);return}
 if(b.dataset.s){var id=b.dataset.id;STATE[id]=STATE[id]===b.dataset.s?undefined:b.dataset.s;if(!STATE[id])delete STATE[id];render();if(OV)showCard(curId);persist()}
});
var qi=document.getElementById('q');qi.value=ui.q||'';
qi.addEventListener('input',function(){ui.q=qi.value;lsSet('ui',ui);render()});
render();
var rr=lsGet('rnd',null);if(rr!=null&&FILMS[rr])showCard(rr);
var sy=lsGet('scroll',0);if(sy){setTimeout(function(){window.scrollTo(0,sy)},50);lsSet('scroll',0)}
})();
</script>
</body>
</html>
